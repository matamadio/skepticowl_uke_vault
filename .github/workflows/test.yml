# Controlla la modalità "A capo" su tutte le canzoni a ogni modifica
name: Test
on:
  push:
  pull_request:
jobs:
  reflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/test_reflow.js
