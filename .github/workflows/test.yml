# A ogni modifica: ogni canzone in elenco ha il suo file (nome esatto) e la
# modalità "A capo" non sposta gli accordi
name: Test
on:
  push:
  pull_request:
jobs:
  reflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/test_files.js
      - run: node tools/test_reflow.js
